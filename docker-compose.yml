# Para probar localmente igual que en Railway: docker compose up --build
# Después abrí http://localhost:8080
services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: gastos_personales
      DB_USER: gastos
      DB_PASS: gastos
      CORS_ALLOW_ORIGIN: "*"
      TOKEN_EXPIRATION_HOURS: 24
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: gastos_personales
      MYSQL_USER: gastos
      MYSQL_PASSWORD: gastos
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
