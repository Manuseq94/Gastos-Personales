Listen ${PORT}

<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html

    # La raíz del sitio lleva al login mediante /index.html (se genera en el Dockerfile).
    # No usamos Redirect de Apache: arma la URL absoluta con ServerName (localhost).

    # Apache a veces no pasa el header Authorization a PHP; lo forzamos.
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Nada fuera de frontend/ y backend/api/ debe ser accesible desde la web.
    <DirectoryMatch "^/var/www/html/(docker|backend/(config|utils|migraciones))">
        Require all denied
    </DirectoryMatch>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
